# Network configuration shared by the indexer and API.
# RPC URLs support ${ENV_VAR} and ${ENV_VAR:default} interpolation.

indexer:
  poll_interval: 180 # Default watch-mode poll interval in seconds

networks:
  ethereum:
    chain_id: 1
    rpc_url: ${ETHEREUM_RPC_URL}
    finality_depth: 12
    poll_interval: 2 # Follow Ethereum head promptly
    name: "Ethereum"
    short_name: "Ethereum"
    emoji: "⛓️"
    explorer: "https://etherscan.io"
    icon: "https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg"
    block_batch_size: 50000
    disabled: false
    # Block lag tolerances for health monitoring
    # AuctionRegistry - primary source for factory discovery
    registry:
      address: "0x94F44706A61845a4f9e59c4Bc08cEA4503e48D12"
      start_block: 23498416
    # Explicit factories not covered by registry discovery
