[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auctionscan-backend"
version = "0.1.0"
description = "SQLite-backed multichain auction indexer and API for Auctionscan"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "PyYAML>=6.0",
  "uvicorn>=0.30,<1",
  "web3>=7,<8",
  "yoyo-migrations>=9,<10",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.11.2"
exclude-newer = "P7D"
