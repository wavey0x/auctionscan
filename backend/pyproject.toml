[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auctionscan-backend"
version = "0.1.0"
description = "SQLite-backed multichain auction indexer and API for Auctionscan"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "PyYAML>=6.0",
  "uvicorn>=0.30,<1",
  "web3>=7,<8",
  "yoyo-migrations>=9,<10",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
# Pyflakes plus the pycodestyle rules that catch real mistakes rather than style.
select = ["F", "E4", "E7", "E9"]

[tool.uv]
required-version = ">=0.11.2"
# uv records this span in uv.lock's [options]. Removing it makes uv 0.13.5
# treat the lockfile as stale, which breaks `uv sync --locked` on the
# deployment host. Change it only together with a regenerated lockfile.
exclude-newer = "P7D"
